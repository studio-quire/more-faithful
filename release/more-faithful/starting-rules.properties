# What a new world starts with in this pack. These are the pack's choices, and they count the first time your game or
# server meets a rule: from then on that rule's start is yours, on Create World's World Rules... page in the game, or in
# config/faithful-rules.properties on a server, and no update changes it. A rule with no line here starts as its mod
# has it.
rule.world-rules.mobs_break_blocks=false
rule.world-rules.blasts_destroy_items=false
rule.world-rules.sleeping=false
rule.world-rules.monster_light=none
rule.world-rules.apple_drops=true
rule.world-rules.falling_bonus=off
rule.world-rules.bows_wear_out=true
rule.pumpkins.spreading=true
