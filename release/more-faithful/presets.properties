# More Faithful's presets: which of its mods are on, one for the whole game, chosen at the top of Options > More Faithful... >
# Mods..., where each click steps to the next in the order of `presets`. A player can still turn single mods on or off after.
# A preset's id (the word after "preset.") is what a player's config/faithful-preset.properties keeps, so it never changes;
# its name and hint are the words players see, and change freely (the hint is the line under the buttons, at most about 100
# letters). `mods` is the mods it has on, by id, with a comma between: "all" is every mod in the pack, and "all but a, b" every
# mod but those, so a mod new to the pack is in every preset that says "all" unless named. The build checks each list names
# only the pack's mods and has what each of them depends on. `preset.default` is what a fresh install starts on.
# The hints describe what each preset has, so they change as the presets do: when a mod joins the
# pack or a preset's list changes, read every hint again, since "all" takes a new mod in silently while its hint stays.
presets=simple,grounded,high
preset.default=high

preset.simple.name=Simple
preset.simple.hint=Beta with a few comforts, nothing new to make: world rules, mending, saplings, wolf packs, snipping.
preset.simple.mods=item-repair, no-toasts, plain-f3, snipping, wild-saplings, wolf-packs, world-rules

preset.grounded.name=Grounded
preset.grounded.hint=Every mod but Alchemy and Golems: new things to make and find, and you still do it all yourself.
preset.grounded.mods=all but alchemy, golems

preset.high.name=High
preset.high.hint=Every mod, Alchemy's potions and the Golems who work for you included.
preset.high.mods=all
